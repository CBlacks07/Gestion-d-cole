##
## Gestion École — Configuration Nginx (réseau local)
## Fichier à placer dans /etc/nginx/sites-available/ecole
##

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/ecole/frontend;
    index index.html;

    # Logs
    access_log /var/log/nginx/ecole-access.log;
    error_log  /var/log/nginx/ecole-error.log;

    # Taille max upload (pour import CSV et logos)
    client_max_body_size 10M;

    # ── API backend ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout généreux pour les grosses opérations (backup/restore)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Frontend React (SPA) ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Cache assets compilés (JS/CSS avec hash dans le nom)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Pas de cache pour index.html
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Health check ────────────────────────────────────────
    location /health {
        proxy_pass http://localhost:5001/health;
    }

    # ── Sécurité : bloquer accès fichiers sensibles ─────────
    location ~ /\. {
        deny all;
    }
}
